name: Publish

# Publishing uses npm Trusted Publishing (OIDC): no long-lived token. The
# trusted publisher must exist on npmjs.com for @ishkulov/ywiki:
#   GitHub Actions · user `ishkulov` · repo `ywiki` · workflow `publish.yml`
# The first successful run validates that configuration, and it expires if it
# is not validated within 2 days.
#
# Tag-triggered publishing is enabled below; `workflow_dispatch` allows a
# manual verification run without pushing a tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required to mint the OIDC token

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Trusted publishing needs npm CLI >= 11.5.1 and Node >= 22.14; Node 24
      # ships a suitable npm, and caching is disabled for release builds.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Test before publishing
        run: npm test
      - name: Publish to npm (OIDC)
        run: npm publish --provenance
